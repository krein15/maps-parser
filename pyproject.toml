[project]
name = "mapsparser"
version = "0.2.0"
description = "Organisations from 2GIS and Yandex Maps into Excel: contacts and what each firm is missing"
requires-python = ">=3.12"
dependencies = ["requests", "openpyxl", "customtkinter", "pillow"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mapsparser*"]

[tool.setuptools.package-data]
mapsparser = ["data/*.json", "templates/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Канареечные тесты ходят в сеть: в обычный прогон они не попадают, их гоняет
# отдельное задание раз в неделю (pytest -m live).
addopts = "-q -m 'not live'"
markers = ["live: ходит в интернет и проверяет, что формат карт не изменился"]
# Без этого пакет виден только при запуске «python -m pytest»: сама команда pytest
# корень проекта в sys.path не кладёт, и на сервере сборки тесты не находят mapsparser.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    "RUF001", # кириллица в строках линтеру кажется латиницей
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]  # поддельные клиенты в тестах используют не все аргументы
"tools/*" = ["E402"]  # вспомогательным скриптам нужно задать sys.path до импорта пакета
